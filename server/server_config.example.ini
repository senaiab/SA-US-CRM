[database]
# Replace CHANGE_THIS_DB_PASSWORD with the password set in sql/create_database.sql
url = mysql+pymysql://sa_us_user:CHANGE_THIS_DB_PASSWORD@127.0.0.1:3306/sa_us_erp?charset=utf8mb4

[server]
host = 0.0.0.0
port = 8080
# Generate with: python -c "import secrets; print(secrets.token_hex(32))"
secret_key = CHANGE_THIS_TO_A_RANDOM_SECRET
# Comma-separated allowed CORS origins. Add LAN IPs if needed (e.g. http://192.168.1.10).
cors_origins = http://127.0.0.1,http://localhost
