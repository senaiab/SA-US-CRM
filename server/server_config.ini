[database]
# Set this during installation. Environment variable SAUS_DATABASE_URL overrides this value.
url = mysql+pymysql://sa_us_user:CHANGE_ME@127.0.0.1:3306/sa_us_erp?charset=utf8mb4

[server]
host = 0.0.0.0
port = 8080
# Leave blank to let the server generate a persistent local secret file, or set a strong random value.
secret_key =
token_expire_hours = 10

[security]
login_rate_window_seconds = 300
login_rate_max = 5
cors_origins = *
